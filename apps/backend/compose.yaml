services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: utg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d utg"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data_18:/var/lib/postgresql

volumes:
  postgres_data_18:

