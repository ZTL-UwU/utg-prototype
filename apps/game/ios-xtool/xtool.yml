version: 1
bundleID: ca.codhers.sozlerseylisi
product: SozlerSeylisi

# Merged over xtool's generated Info.plist (our keys win)
infoPath: Info.plist

# Copied from the Capacitor asset catalog by run-ios.sh (see note there)
iconPath: icon.png

# Copied into the ROOT of the .app, which is where Capacitor looks for them.
# These are regenerated by `npx cap copy ios`.
resources:
  - ../ios/App/App/public
  - ../ios/App/App/capacitor.config.json
  - ../ios/App/App/config.xml
