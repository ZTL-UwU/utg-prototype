packages:
  - apps/*
  - packages/*

allowBuilds:
  '@ffmpeg-installer/linux-x64': false
  cpu-features: false
  esbuild: true
  msw: false
  sharp: false

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: 4.1.10
  vite-plus: ^0.2.4

minimumReleaseAgeExclude:
  - lucide-react@1.24.0

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
